name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Share server tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Worker tests
        working-directory: server
        run: npm test

  build:
    name: Compile (iOS, unsigned)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: ci/select-xcode.sh

      - name: Lens planner tests
        run: |
          swiftc RetroCam/LensPlanner.swift ci/lens-tests/main.swift -o "$RUNNER_TEMP/lens-tests"
          "$RUNNER_TEMP/lens-tests"

      - name: Film model tests
        run: |
          swiftc RetroCam/ColorGrade.swift RetroCam/FilmStock.swift RetroCam/FilmLibrary.swift RetroCam/Roll.swift RetroCam/FilmCode.swift RetroCam/ShareLinks.swift ci/film-tests/main.swift -o "$RUNNER_TEMP/film-tests"
          "$RUNNER_TEMP/film-tests"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project RetroCam.xcodeproj \
            -scheme RetroCam \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log

      - name: Show generated Info.plist
        run: |
          plist=build/DerivedData/Build/Products/Release-iphoneos/RetroCam.app/Info.plist
          plutil -p "$plist"
          # Film recipe links (exposures://) need the URL type merged from Config/Info.plist.
          plutil -p "$plist" | grep -q '"exposures"' || { echo "exposures URL scheme missing"; exit 1; }
          # The camera control (Control Center / Lock Screen) ships inside the app.
          ext=build/DerivedData/Build/Products/Release-iphoneos/RetroCam.app/PlugIns/FilmExposuresControls.appex
          plutil -p "$ext/Info.plist"
          plutil -p "$ext/Info.plist" | grep -q 'com.apple.widgetkit-extension' || { echo "camera control extension missing"; exit 1; }

      - name: Build without the camera control
        # What TestFlight does when there's no PROVISIONING_PROFILE_CONTROLS secret.
        run: |
          set -o pipefail
          ci/without-controls.sh
          rm -rf build/DerivedData/Build/Products/Release-iphoneos/RetroCam.app
          xcodebuild build \
            -project RetroCam.xcodeproj \
            -scheme RetroCam \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tee -a build.log
          app=build/DerivedData/Build/Products/Release-iphoneos/RetroCam.app
          [ -f "$app/Info.plist" ] || { echo "app missing"; exit 1; }
          [ ! -d "$app/PlugIns/FilmExposuresControls.appex" ] || { echo "control still embedded"; exit 1; }
          git checkout -- RetroCam.xcodeproj/project.pbxproj

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
