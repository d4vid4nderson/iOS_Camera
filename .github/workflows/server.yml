name: Share server

# Deploys the share-link server (server/) to Cloudflare Workers when it changes on
# main, or on demand ("Run workflow").
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   API token with "Workers Scripts: Edit" and "Workers R2 Storage: Edit"
#   CLOUDFLARE_ACCOUNT_ID  Your Cloudflare account ID (dashboard sidebar)
#   FACEBOOK_APP_SECRET    Optional: the Meta app's App Secret, for Facebook Login
# Until both exist this workflow skips the deploy instead of failing.
on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server.yml']
  workflow_dispatch:

concurrency:
  group: share-server
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Worker tests
        run: npm test

      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set yet; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the photo bucket (once)
        if: steps.secrets.outputs.ready == 'true'
        run: npx --yes wrangler@4.42.0 r2 bucket create exposures-rolls || echo "Bucket already exists."

      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        run: npx --yes wrangler@4.42.0 deploy

      - name: Facebook Login secret
        if: steps.secrets.outputs.ready == 'true' && env.FACEBOOK_APP_SECRET != ''
        run: printf '%s' "$FACEBOOK_APP_SECRET" | npx --yes wrangler@4.42.0 secret put FACEBOOK_APP_SECRET
