# Cloudflare Worker that serves Exposures share links:
#   /f/<code>   a shared film (the whole recipe is in the link; nothing stored)
#   /r/<id>     a shared roll (photos stored in R2 for 30 days)
# Deployed by .github/workflows/server.yml with the CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID repository secrets.
name = "exposures"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[r2_buckets]]
binding = "ROLLS"
bucket_name = "exposures-rolls"

# Daily sweep of expired rolls.
[triggers]
crons = ["17 4 * * *"]

[vars]
# App Store page for the "Get Exposures" button; empty hides the button.
APP_STORE_URL = ""
