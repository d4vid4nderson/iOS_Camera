# Cloudflare Worker that serves Film Exposures share links, accounts and profiles:
#   /f/<code>   a shared film (the whole recipe is in the link; nothing stored)
#   /r/<id>     a shared roll (photos stored in R2 for 30 days)
# Deployed by .github/workflows/server.yml with the CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID repository secrets.
name = "exposures"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true
# Serve the links at filmexposures.com (a Cloudflare custom domain: the deploy creates the
# DNS record and certificate). The workers.dev address keeps working too.
routes = [
  { pattern = "filmexposures.com", custom_domain = true },
  { pattern = "www.filmexposures.com", custom_domain = true },
]

# Static files (the website's film previews, rendered by server/tools/render_previews.py).
# A request for one of these paths is served straight from here, before the Worker runs.
[assets]
directory = "./public"

[[r2_buckets]]
binding = "ROLLS"
bucket_name = "exposures-rolls"

# Daily sweep of expired rolls.
[triggers]
crons = ["17 4 * * *"]

[vars]
# The app's Apple ID (App Store Connect -> App Information -> Apple ID), for the
# "Get Exposures" buttons and Safari's app banner. Or set APP_STORE_URL to a full link
# (e.g. a public TestFlight invite). Both empty: pages say it's coming soon.
APP_STORE_ID = ""
APP_STORE_URL = ""
# Sign in with Google: the app's iOS OAuth client ID from Google Cloud (comma-separate
# several). Client IDs aren't secret. Empty: Google sign-in is refused.
GOOGLE_CLIENT_IDS = ""
# Facebook Login: the Meta app's App ID (not secret). Its App Secret goes in the
# FACEBOOK_APP_SECRET repository secret; the deploy workflow hands it to the Worker.
FACEBOOK_APP_ID = ""
